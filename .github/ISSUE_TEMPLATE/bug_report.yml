name: Bug report
description: Report reproducible behavior using fictional data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use fictional data. Do not include secrets, guest details or invitation codes.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit/version and browser
